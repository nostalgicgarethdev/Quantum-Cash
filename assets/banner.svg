    <text x="590" y="248" fill="#f4f7fb" font-size="68" font-weight="700" letter-spacing="1.5">QUANTUMCASH</text>
    <text x="590" y="300" fill="#3ee0a0" font-size="28" font-weight="650">$QCash</text>
    <text x="712" y="300" fill="#93a0b8" font-size="22" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace">ticker QCASH</text>
    <text x="590" y="356" fill="#c5d0e0" font-size="22">UTXO ledger · proof-of-history clock · hash-based signatures</text>
