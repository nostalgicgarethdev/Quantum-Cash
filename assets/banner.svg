<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-label="QuantumCash banner">
  <title>QuantumCash</title>
  <desc>QuantumCash banner. Dark field, orbital Q mark, and the words experimental testnet, not money.</desc>
  <defs>
    <radialGradient id="wash" cx="18%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#143028"/>
      <stop offset="55%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" cx="88%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#2a2158"/>
      <stop offset="100%" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7fff5"/>
      <stop offset="38%" stop-color="#3ee0a0"/>
      <stop offset="100%" stop-color="#0f8f6a"/>
    </linearGradient>
    <linearGradient id="violet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efeaff"/>
      <stop offset="42%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#5b4cdb"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb0c8" stroke-opacity="0.06"/>
    </pattern>
  </defs>
